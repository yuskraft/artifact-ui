name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  dist-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: dist/artifact.css is up to date
        run: node scripts/build.mjs --check
      - name: contrast gate (present only after plan 003 lands)
        run: |
          if [ -f scripts/contrast.mjs ]; then node scripts/contrast.mjs; else echo "no contrast script yet — skipping"; fi
