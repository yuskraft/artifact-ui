name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  dist-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: skills/artifact-ui/dist/artifact.css is up to date
        run: node scripts/build.mjs --check
      - name: contrast gate (WCAG AA)
        run: node scripts/contrast.mjs
      - name: slop gate (default-artifact tells)
        run: node scripts/lint.mjs
